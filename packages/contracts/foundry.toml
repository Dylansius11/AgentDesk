[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"
evm_version = "cancun"
gas_reports = ["ProofLedger"]
fs_permissions = [{ access = "read-write", path = "./exported" }]
# Meter every external call as its own isolated transaction (matches real
# on-chain gas: no warm-slot leakage between e.g. a test's constructor call
# and the function call being measured). Without this, gasleft()-delta
# measurements and --gas-report numbers can under-report real cost by
# ~20% for a fresh-storage call — see registerDecision's gas test/comment.
isolate = true

[fuzz]
runs = 256

# Invariant checks run after every call in a sequence, and this suite's
# checks are O(records-created-so-far) — the framework defaults (256 runs *
# 500 depth) turn that into tens of millions of getDecision/getOutcome calls
# and take many minutes. These bounds still exercise long, varied call
# sequences (up to 12,800 handler calls per `forge test` invocation) while
# keeping the suite fast enough to run on every commit.
[invariant]
runs = 32
depth = 400
fail_on_revert = true

# Deploy targets (BSC) — used by Phase-B deploy scripts, not by this task.
[rpc_endpoints]
bsc_chapel = "${BSC_CHAPEL_RPC_URL}"
bsc_mainnet = "${BSC_MAINNET_RPC_URL}"

[etherscan]
bsc_chapel = { key = "${BSCSCAN_API_KEY}", chain = 97, url = "https://api-testnet.bscscan.com/api" }
bsc_mainnet = { key = "${BSCSCAN_API_KEY}", chain = 56, url = "https://api.bscscan.com/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
